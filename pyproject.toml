[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harv-language"
version = "0.1.0"
description = "Experimental declarative language for scalar ODE simulations"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
harv = "harv.cli:main"
harvc = "harv.cli:main"

[tool.setuptools]
packages = ["harv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
